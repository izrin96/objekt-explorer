schema: spec-driven

context: |
  Objekt Explorer — Bun 1.4 + Turbo monorepo. Read AGENTS.md first; it is the authority on
  structure, commands and code style (oxlint + oxfmt, TS strict, `import * as z from "zod"`,
  no class/enum, theme spacing over arbitrary values, catalog: for shared deps).
  Frontend: TanStack React Start + Vite + React 19 + Tailwind v4, ORPC + Zod, React Query,
  Zustand (selectors only), Better Auth, Paraglide i18n. Database: PostgreSQL 18 + Drizzle.
  The frontend is `apps/web` (Base UI via the cnippet registry). The legacy `apps/website` and
  the `apps/lab` prototype are removed; `design/archive/` keeps their notes as history.
  Each package's conventions live in its own `AGENTS.md` (`apps/web`, `apps/worker`,
  `apps/indexer`, `packages/api`, `packages/db`); a change touching that package follows them.
  `packages/api` is the shared server layer.
  Comments: as few as possible. Comment only a non-obvious why (workaround, invariant, trap)
  the code cannot express; never narrate what the next line does, never record history
  ("round N", "the lab did X"), no JSDoc on obvious props. Registry files under
  `components/ui` are the exception.
  The root `.env` points at the PRODUCTION database and services. Workers never delete, unlink,
  remove or reset anything through the app or the API, never run `db:*` scripts, and never
  create accounts or data without the user's explicit approval for that specific action.
  Mutation flows are verified up to the request boundary (validation, the request that would
  be sent) and recorded as "read-only verified"; read paths are exercised for real.
  The checks are `bun run lint`, `bun run typecheck`, `bun run test` and `bun run build`;
  tests cover pure modules only (see AGENTS.md). Never git commit, push or run DB migrations
  without explicit approval.

rules:
  proposal:
    - Include a "Non-goals" section and name the route(s) the change covers
    - Keep proposals under 600 words
  tasks:
    - Each task ends with lint + typecheck + build passing for the touched package
    - The last task updates the `AGENTS.md` of every touched package (or the root one) whose
      conventions, traps or workflow the change alters, or states that none changed
  design:
    - Prefer an existing component or store over a new one; say why when it does not fit
