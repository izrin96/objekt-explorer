services:
  # background worker
  worker:
    restart: always
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@pgbouncer:5432/main
      - INDEXER_DATABASE_URL=postgresql://postgres:postgres@pgbouncer-indexer:5432/indexer
      - REDIS_URL=redis://valkey:6379
      - INDEXER_RPC_ENDPOINT
      - S3_ENDPOINT
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_REGION
      - S3_BUCKET
      - S3_PUBLIC_URL
      - COSMO_KEY
      - CENTRIFUGO_URL=http://centrifugo:8000
      - CENTRIFUGO_API_KEY
      - WORKER_LOG_LEVEL
      - WORKER_SENTRY_DSN
      - SENTRY_ENVIRONMENT
      - SENTRY_RELEASE
    healthcheck:
      test: test ! -f /tmp/drain
      interval: 5s
      retries: 1

  # indexer processor
  processor:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    restart: always
    environment:
      - FORCE_PRETTY_LOGGER=${INDEXER_FORCE_PRETTY_LOGGER}
      - RPC_ENDPOINT=${INDEXER_RPC_ENDPOINT}
      - RPC_RATE_LIMIT=${INDEXER_RPC_RATE_LIMIT}
      - RPC_FINALITY=${INDEXER_RPC_FINALITY}
      - SQD_ENDPOINT=${INDEXER_SQD_ENDPOINT}
      - SQD_API_KEY=${INDEXER_SQD_API_KEY}
      - DB_URL=postgresql://postgres:postgres@postgres-indexer:5432/indexer
      - DB_NAME=indexer
      - DB_READ_USER=postgres-read
      - DB_READ_PASS=postgres-read
      - ENABLE_OBJEKTS=${INDEXER_ENABLE_OBJEKTS}
      - ENABLE_GRAVITY=${INDEXER_ENABLE_GRAVITY}
      - COSMO_PARALLEL_COUNT=${INDEXER_COSMO_PARALLEL_COUNT}
      - REDIS_URL=redis://valkey:6379
      # diagnostic-only, unset in production
      - START_BLOCK=${INDEXER_START_BLOCK:-}
      - SKIP_METADATA=${INDEXER_SKIP_METADATA:-}
      - SKIP_OUTBOX=${INDEXER_SKIP_OUTBOX:-}

  # postgres database for indexer
  postgres-indexer:
    restart: always
    image: postgres:18
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      - POSTGRES_DB=indexer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: "pg_isready -d indexer -U postgres"
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    volumes:
      - postgres-indexer-data:/var/lib/postgresql

  # pgbouncer for indexer
  pgbouncer-indexer:
    image: edoburu/pgbouncer:latest
    restart: always
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres-indexer
      - DB_NAME=indexer
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
      - MAX_CLIENT_CONN=300
      - MIN_POOL_SIZE=5
      - DEFAULT_POOL_SIZE=20
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]

  # web
  web:
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      secrets:
        - VITE_UMAMI_SCRIPT_URL
        - VITE_UMAMI_WEBSITE_ID
        - VITE_LIVE_API_KEY
        - SENTRY_AUTH_TOKEN
      # source map upload; the build skips it unless these and SENTRY_AUTH_TOKEN are all set
      args:
        SENTRY_URL: ${SENTRY_URL:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    environment:
      - VITE_UMAMI_SCRIPT_URL
      - VITE_UMAMI_WEBSITE_ID
      - BETTER_AUTH_SECRET
      - SITE_URL
      - DISCORD_CLIENT_ID
      - DISCORD_CLIENT_SECRET
      - TWITTER_CLIENT_ID
      - TWITTER_CLIENT_SECRET
      - DATABASE_URL
      - INDEXER_DATABASE_URL
      - INDEXER_RPC_ENDPOINT
      - S3_ENDPOINT
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_REGION
      - S3_BUCKET
      - S3_PUBLIC_URL
      - SES_REGION
      - SES_ACCESS_KEY
      - SES_SECRET_KEY
      - SES_MAIL_FROM
      - VITE_LIVE_API_KEY
      - BYPASS_LIVE_KEY
      - REDIS_URL=redis://valkey:6379
      - CENTRIFUGO_URL=http://centrifugo:8000
      - CENTRIFUGO_API_KEY
      - CENTRIFUGO_TOKEN_SECRET
      - SENTRY_DSN
      - SENTRY_ENVIRONMENT
      - SENTRY_RELEASE
    healthcheck:
      test: test ! -f /tmp/drain && curl -f http://localhost:3000/api/healthcheck
      interval: 5s
      retries: 1

  # real-time server; browsers reach it through /connection on the site's origin, and /api stays internal
  centrifugo:
    restart: always
    image: centrifugo/centrifugo:v6
    command: centrifugo --config=/centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    expose:
      - "8000"
    environment:
      - CENTRIFUGO_CLIENT_ALLOWED_ORIGINS=${SITE_URL:-}
      - CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_TOKEN_SECRET:-}
      - CENTRIFUGO_HTTP_API_KEY=${CENTRIFUGO_API_KEY:-}
      # the config runs the memory engine; staging and production set these two to their own Valkey,
      # never to the one in REDIS_URL, which another stack may share
      - CENTRIFUGO_ENGINE_TYPE
      - CENTRIFUGO_ENGINE_REDIS_ADDRESS
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # error tracking (GlitchTip, Sentry-compatible), started only with `--profile glitchtip`.
  # GlitchTip 6 runs one process that serves the UI and API and runs its task worker; it refuses a
  # separate worker role. Browsers never reach it: the web app forwards their reports through
  # /api/errors. The UI is on 127.0.0.1 only
  glitchtip:
    profiles: [glitchtip]
    restart: always
    image: glitchtip/glitchtip:6
    depends_on:
      glitchtip-db-init:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      # its own role and database; straight to postgres, since pgbouncer serves only `main` and its
      # transaction pooling would break the advisory lock GlitchTip's startup migration takes
      - DATABASE_URL=postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:-}@postgres:5432/glitchtip
      # its own database index; the app and the indexer use 0. It shares Valkey's memory and CPU
      - VALKEY_URL=redis://valkey:6379/1
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:-}
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN:-http://localhost:8001}
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - DEFAULT_FROM_EMAIL=${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
      # accounts come from `manage.py createsuperuser` and invitations, never self sign-up
      - ENABLE_USER_REGISTRATION=False
      - ENABLE_ADMIN=False
      - ENABLE_OPENAPI=False
      - GLITCHTIP_ENABLE_MCP=False
      - GLITCHTIP_ENABLE_UPTIME=False
      - GLITCHTIP_ENABLE_LOGS=False
    volumes:
      - glitchtip-uploads:/code/uploads

  # Creates GlitchTip's role and database in the shared postgres, idempotently; initdb never reruns
  # on an existing volume. It also checks the two secrets: a `${VAR:?}` would fail every compose
  # command, with or without this profile, so the check lives here and stops GlitchTip from starting.
  # The app connects as the superuser `postgres`, which CONNECT privileges do not bind, so revoking
  # PUBLIC's CONNECT on `main` keeps the glitchtip role out of the app's data.
  glitchtip-db-init:
    profiles: [glitchtip]
    image: postgres:18
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=main
      - GLITCHTIP_SECRET_KEY=${GLITCHTIP_SECRET_KEY:-}
      - GLITCHTIP_DB_PASSWORD=${GLITCHTIP_DB_PASSWORD:-}
    command:
      - sh
      - -ec
      - |
        [ -n "$$GLITCHTIP_SECRET_KEY" ] || { echo "GLITCHTIP_SECRET_KEY is not set" >&2; exit 1; }
        [ -n "$$GLITCHTIP_DB_PASSWORD" ] || { echo "GLITCHTIP_DB_PASSWORD is not set" >&2; exit 1; }
        psql -v ON_ERROR_STOP=1 -v pw="$$GLITCHTIP_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE glitchtip' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'glitchtip')\gexec
        ALTER ROLE glitchtip WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'pw';
        SELECT 'CREATE DATABASE glitchtip OWNER glitchtip' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'glitchtip')\gexec
        ALTER DATABASE glitchtip OWNER TO glitchtip;
        REVOKE CONNECT ON DATABASE glitchtip FROM PUBLIC;
        REVOKE CONNECT ON DATABASE main FROM PUBLIC;
        SQL

  # postgres database for web
  postgres:
    restart: always
    image: postgres:18
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgbouncer for web
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_NAME=main
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
      - MAX_CLIENT_CONN=300
      - MIN_POOL_SIZE=5
      - DEFAULT_POOL_SIZE=20
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]

  # redis compatible image
  valkey:
    restart: always
    image: valkey/valkey:latest
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-data:
  postgres-indexer-data:
  glitchtip-uploads:

secrets:
  VITE_UMAMI_SCRIPT_URL:
    environment: VITE_UMAMI_SCRIPT_URL
  VITE_UMAMI_WEBSITE_ID:
    environment: VITE_UMAMI_WEBSITE_ID
  VITE_LIVE_API_KEY:
    environment: VITE_LIVE_API_KEY
  # GlitchTip token for the source map upload; optional
  SENTRY_AUTH_TOKEN:
    environment: SENTRY_AUTH_TOKEN
