name: Docker CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    branches: ["main"]
    inputs:
      force_build_all:
        description: "Force the web image build regardless of changes"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a superseded PR push is wasted work; a main push is a deploy and finishes
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      worker: ${{ steps.filter.outputs.worker }}
      indexer: ${{ steps.filter.outputs.indexer }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'turbo.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'turbo.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
            indexer:
              - 'apps/indexer/**'
              - 'packages/**'
              - 'turbo.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
            packages:
              - 'packages/**'
              - '.github/workflows/**'

  validate:
    runs-on: ubuntu-latest
    needs: detect-changes
    # Only run validation if there are code changes
    if: |
      needs.detect-changes.outputs.web == 'true' ||
      needs.detect-changes.outputs.worker == 'true' ||
      needs.detect-changes.outputs.indexer == 'true' ||
      needs.detect-changes.outputs.packages == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # the same Bun the Dockerfiles run
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Turbo's task hashes decide what is reused; the key only picks the blob. It starts over
      # when bun.lock or the root package.json (Bun version, catalog) changes, which keeps it small
      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}-

      - name: Check formatting
        run: bunx oxfmt --check

      - name: Lint, type check and test
        run: bun run check

      # main only: PR saves would spend the repo's cache quota, which the Docker layer cache shares
      - name: Save Turbo cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}-${{ github.sha }}

  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    # Only web is built here; worker and indexer images are built on the VPS. Runs beside
    # validate and pushes only the commit tag; tag-latest moves :latest once validate passes
    if: |
      needs.detect-changes.outputs.web == 'true' ||
      github.event_name == 'workflow_dispatch'
    environment: ${{ github.event_name == 'pull_request' && 'Staging' || 'Production' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: ./apps/web/Dockerfile
    steps:
      - name: Show detected changes
        run: |
          echo "Changes detected for ${{ matrix.app }}: ${{ needs.detect-changes.outputs[matrix.app] }}"
          echo "Web changes: ${{ needs.detect-changes.outputs.web }}"
          echo "Worker changes: ${{ needs.detect-changes.outputs.worker }}"
          echo "Indexer changes: ${{ needs.detect-changes.outputs.indexer }}"
          echo "Package changes: ${{ needs.detect-changes.outputs.packages }}"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }} docker image
        # Only build if this specific app has changes or force build is enabled
        if: needs.detect-changes.outputs[matrix.app] == 'true' || github.event.inputs.force_build_all == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          # Only push to registry on main branch, not on PRs
          push: ${{ github.event_name != 'pull_request' }}
          # Load image locally on PRs for validation
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # public client values and the source map upload; only apps/web declares these args.
          # The upload runs only with the token, org, project and release all set, so the Staging
          # environment, which has no token, uploads nothing
          build-args: |
            VITE_UMAMI_SCRIPT_URL=${{ vars.VITE_UMAMI_SCRIPT_URL }}
            VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}
            VITE_LIVE_API_KEY=${{ vars.VITE_LIVE_API_KEY }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_RELEASE=${{ vars.SENTRY_RELEASE }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  # Production pulls :latest by hand, so it only ever points at an image whose commit passed validate
  tag-latest:
    runs-on: ubuntu-latest
    needs: [detect-changes, validate, build]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.build.result == 'success' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.detect-changes.outputs.web == 'true' || github.event.inputs.force_build_all == 'true')
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point web latest at this commit
        run: docker buildx imagetools create -t ghcr.io/${{ github.repository }}-web:latest ghcr.io/${{ github.repository }}-web:${{ github.sha }}

  cleanup:
    runs-on: ubuntu-latest
    needs: [detect-changes, build, tag-latest]
    # Run cleanup only on main branch and only if build succeeded or was skipped
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        app: [web]
    steps:
      - name: Delete untagged ${{ matrix.app }} images
        if: needs.detect-changes.outputs[matrix.app] == 'true' || github.event.inputs.force_build_all == 'true'
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}-${{ matrix.app }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 10
